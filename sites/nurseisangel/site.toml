# nurseisangel.com (ptk-studio#191). Audience: nurses and the people who buy gifts for them (market D, R73).
# A "coming" product needs no link: it shows "Coming soon", with no button and no redirect. Set status = "live" and
# the real store link when the listing is live; only live products get a /go/<id> redirect.
# Images: ~600 px web previews in img/, copied from the 88eggs Assets noted on each product (R62: the asset is the
# source; these are built copies). The product ids are the Marketing Products ids and must match 88eggs funnel_sites.product_ids.
domain = "nurseisangel.com"
title = "Nurse Is Angel"
description = "Thank-you gifts for nurses: tees and wall art for the people who stay through the night."
audience = "Nurses, and the families, patients and coworkers who want to thank them"
market = "D"
accent = "#2f5d8a"
brand = "Honey Storm, by PTK Studio"
disclosure = "Designed by Honey Storm. The designs are set in type by our own tools; this page's words were drafted with AI help and checked by our team."
# The Feedback app's public key for this site, added when the key is issued (88eggs Feedback app). Empty = no widget.
feedback_key = ""



