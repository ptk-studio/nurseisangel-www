<!doctype html>
<html lang="en" data-page="/404"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found · {{title}}</title><meta name="robots" content="noindex">
<style>
:root{--accent:{{accent}};--bg:#fffdf9;--fg:#1d1d24;--muted:#5d5d6b;--line:#e9e4dc;--card:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--fg:#f3f1ee;--muted:#a9a7b2;--line:#2c2b33;--card:#1c1b21}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Iowan Old Style","Times New Roman",serif}
header,main,footer{max-width:960px;margin:0 auto;padding:0 20px}
header{padding-top:28px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo{font:700 20px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;color:var(--fg);text-decoration:none}
.logo span{color:var(--accent)}
nav a{font:15px system-ui,-apple-system,sans-serif;color:var(--muted)}
.hero{padding:48px 0 24px}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0 0 12px}
.hero p{font-size:19px;color:var(--muted);max-width:640px;margin:0}
.story{max-width:680px}.story h2{margin-top:36px}
.grid{list-style:none;padding:0;margin:24px 0 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.card img,.card .ph{width:100%;height:auto;aspect-ratio:1;border-radius:10px;object-fit:cover;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.card h3{font-size:19px;margin:14px 0 4px}.card p{margin:4px 0}
.meta{font:14px system-ui,-apple-system,sans-serif;color:var(--muted)}
.buy,.soon{margin-top:auto;padding-top:12px;font:600 15px system-ui,-apple-system,sans-serif}
.buy{display:inline-block;margin-top:auto;background:var(--accent);color:#fff;text-decoration:none;border-radius:999px;padding:10px 18px;text-align:center}
.buy:focus-visible,a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.soon{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:20px;margin-top:24px;font:14px/1.6 system-ui,-apple-system,sans-serif;color:var(--muted)}
footer a{color:var(--muted)}
</style></head><body>
<header><a class="logo" href="/">{{title}}</a><nav><a href="/privacy/">Privacy</a></nav></header>
<main class="story"><h1>We couldn't find that page</h1><p><a href="/">See the collection</a></p></main>
<footer><p>{{disclosure}}</p><p>{{brand}} · <a href="/privacy/">Privacy</a> · {{domain}} · © {{year}}</p></footer>
{{beacon}}
</body></html>
